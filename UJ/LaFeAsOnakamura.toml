# cRPA interaction of the Fe-3d five-orbital (d) model of LaFeAsO, one Fe site.
# U: intra-orbital (diagonal) and inter-orbital U' (off-diagonal); J: Hund coupling.
# Orbital order: Wannier90 d (l=2) order; it must match that of the hamiltonian it is used with.
# Please cite the paper below (source/title/doi) when you use this set.
material = "LaFeAsO"
source   = "K. Nakamura, R. Arita, and M. Imada, J. Phys. Soc. Jpn. 77, 093711 (2008)"
title    = "Ab initio Derivation of Low-Energy Model for Iron-Based Superconductors LaFeAsO and LaFePO"
doi      = "10.1143/JPSJ.77.093711"
arxiv    = "0806.4750"
units    = "eV"
orbitals = ["dz2", "dxz", "dyz", "dx2-y2", "dxy"]   # Wannier90 order

U = [
  [3.27, 2.20, 2.20, 1.65, 1.89],
  [2.20, 2.77, 1.78, 1.67, 1.95],
  [2.20, 1.78, 2.77, 1.67, 1.95],
  [1.65, 1.67, 1.67, 2.20, 2.09],
  [1.89, 1.95, 1.95, 2.09, 3.31],
]

J = [
  [0.00, 0.41, 0.41, 0.50, 0.64],
  [0.41, 0.00, 0.45, 0.43, 0.54],
  [0.41, 0.45, 0.00, 0.43, 0.54],
  [0.50, 0.43, 0.43, 0.00, 0.27],
  [0.64, 0.54, 0.54, 0.27, 0.00],
]
